<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pap-Pay — crypto payroll wallet · Anastasiia Petrenko</title>
  <meta name="description" content="Pap-Pay — an iOS crypto payroll wallet. Employees are paid in BTC and cash out to their card. Case study in progress." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       Pap-Pay — self-contained, dark-only case system.
       Clean scaffold: design tokens + shell + reusable helpers.
       Case content is built section by section on top of this.
       ============================================================ */
    :root {
      /* palette — dark green ground, lime accent */
      --pp-bg:        #0A140E;
      --pp-bg-2:      #0D1A12;
      --pp-surface:   #12211A;
      --pp-surface-2: #16281E;
      --pp-border:    rgba(227,252,83,0.12);
      --pp-hair:      rgba(234,243,234,0.08);
      --pp-lime:      #E3FC53; /* --color-text-accent from the Figma system */
      --pp-lime-dim:  rgba(227,252,83,0.14);
      --pp-text:      #EAF3EA;
      --pp-muted:     rgba(234,243,234,0.58);
      --pp-dim:       rgba(234,243,234,0.34);
      --pp-danger:    #FF5B4A;

      /* type */
      --pp-sans: 'Manrope', system-ui, sans-serif;
      --pp-num:  'Roboto', 'Manrope', monospace; /* second face — digits */

      /* motion tokens — durations */
      --dur-100: 100ms;
      --dur-200: 200ms;
      --dur-300: 300ms;
      --dur-500: 500ms;
      /* motion tokens — curves */
      --ease-standard:   cubic-bezier(0.2, 0, 0, 1);
      --ease-decelerate: cubic-bezier(0, 0, 0, 1);  /* entering elements */
      --ease-accelerate: cubic-bezier(0.3, 0, 1, 1); /* exiting elements  */

      /* layout */
      --pp-max: 1200px;
      --pp-px:  60px;
      --pp-header-h: 68px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--pp-bg);
      color: var(--pp-text);
      font-family: var(--pp-sans);
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      padding-top: var(--pp-header-h);   /* clears the fixed header */
    }
    img, video { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }

    .pp-container { max-width: var(--pp-max); margin: 0 auto; padding: 0 var(--pp-px); }
    .pp-section   { padding: 100px 0; border-top: 1px solid var(--pp-hair); }
    .pp-num { font-family: var(--pp-num); font-variant-numeric: tabular-nums; }

    /* ---- header — same pattern as the other case pages ---- */
    .pp-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px; height: var(--pp-header-h); padding: 0 var(--pp-px);
      background: rgba(10,20,14,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--pp-hair);
    }
    .pp-header__back {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 500; color: var(--pp-muted);
      transition: color var(--dur-200) var(--ease-standard);
    }
    .pp-header__back:hover { color: var(--pp-text); }
    .pp-header__nav { display: flex; gap: 28px; align-items: center; font-size: 14px; }
    .pp-header__nav a { color: var(--pp-muted); transition: color var(--dur-200) var(--ease-standard); }
    .pp-header__nav a:hover { color: var(--pp-text); }
    .pp-header__nav a.pp-header__contact { color: var(--pp-lime); }
    .pp-header__nav a.pp-header__contact:hover { color: var(--pp-text); }

    /* ---- shared type helpers ---- */
    .pp-eyebrow {
      font-size: 12px; font-weight: 600; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--pp-lime);
    }
    .pp-h2 { font-size: clamp(28px, 4vw, 44px); font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; }
    .pp-lead { font-size: clamp(17px, 2.2vw, 20px); color: var(--pp-muted); max-width: 60ch; }
    .pp-body { font-size: 16px; color: var(--pp-muted); }
    .pp-accent { color: var(--pp-lime); }

    /* ============================================================
       Reusable media slot — renders a labelled placeholder until a
       video is dropped in; JS swaps in an autoplaying <video> from
       data-src (webm + mp4 + poster). Kept for building blocks.
       ============================================================ */
    .pp-media {
      position: relative; overflow: hidden;
      background: var(--pp-surface);
      border: 1px solid var(--pp-border); border-radius: 20px;
      aspect-ratio: var(--pp-ratio, 16 / 10);
    }
    .pp-media video { width: 100%; height: 100%; object-fit: cover; }
    .pp-media__ph {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; text-align: center; padding: 24px;
      background: radial-gradient(120% 80% at 78% 18%, var(--pp-lime-dim), transparent 60%), var(--pp-surface);
    }
    .pp-media__ph-tag {
      font-family: var(--pp-num); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--pp-lime); border: 1px solid var(--pp-border); border-radius: 999px; padding: 5px 12px;
    }
    .pp-media__ph-label { font-size: 14px; color: var(--pp-text); font-weight: 600; }
    .pp-media__ph-spec  { font-family: var(--pp-num); font-size: 12px; color: var(--pp-dim); }

    /* ---- empty-state placeholder for the fresh page ---- */
    .pp-blank {
      min-height: calc(100vh - var(--pp-header-h));
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; text-align: center; padding: 40px var(--pp-px);
    }
    .pp-blank h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 800; letter-spacing: -0.02em; }
    .pp-blank p { color: var(--pp-muted); max-width: 44ch; }

    /* ---- footer ---- */
    .pp-footer { border-top: 1px solid var(--pp-hair); padding: 40px var(--pp-px); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; color: var(--pp-dim); font-size: 14px; }

    /* ---- reveal — entering elements use decelerate + 500ms ---- */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity var(--dur-500) var(--ease-decelerate), transform var(--dur-500) var(--ease-decelerate); }
    .reveal.is-visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      html { scroll-behavior: auto; }
    }

    /* ---- mobile ---- */
    @media (max-width: 768px) {
      :root { --pp-px: 20px; }
      .pp-header__nav { display: none; }   /* back-link only, as on the other cases */
      .pp-section { padding: 64px 0; }
      .pp-footer { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="pp-header">
    <a href="../index.html" class="pp-header__back">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to works
    </a>
    <nav class="pp-header__nav">
      <a href="../index.html#work">Work</a>
      <a href="../index.html#about">About</a>
      <a href="mailto:petrenkoag95@gmail.com" class="pp-header__contact">Contact</a>
    </nav>
  </header>

  <!-- ============================================================
       PAGE CONTENT — cleared. Build the case sections here.
       ============================================================ -->
  <main>
    <section class="pp-blank">
      <span class="pp-eyebrow">Pap-Pay</span>
      <h1>Case study in progress</h1>
      <p>Starting fresh — the write-up is being rebuilt.</p>
    </section>
  </main>

  <footer class="pp-footer">
    <span>Anastasiia Petrenko — Lead Product Designer</span>
    <span>Pap-Pay · © 2026</span>
  </footer>

  <script>
    /* ---- Reveal on scroll (entering = decelerate) ---- */
    (function () {
      var els = document.querySelectorAll('.reveal');
      if (!els.length) return;
      if (!('IntersectionObserver' in window)) { els.forEach(function (e) { e.classList.add('is-visible'); }); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) { en.target.classList.add('is-visible'); io.unobserve(en.target); }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
      els.forEach(function (e) { io.observe(e); });
    })();

    /* ---- Video hydration helper (kept for building blocks) ----
       Builds an autoplaying loop from a basename (webm + mp4 + poster),
       muted + playsinline so iOS autoplays; replaces the placeholder
       only once a source is actually playable. */
    function ppHydrate(slot, base, poster, phSelector) {
      if (!base) return;
      var v = document.createElement('video');
      v.autoplay = true; v.loop = true; v.muted = true;
      v.setAttribute('muted', ''); v.playsInline = true; v.setAttribute('playsinline', '');
      if (poster) v.poster = poster;
      v.preload = 'metadata';
      [['webm', 'video/webm'], ['mp4', 'video/mp4']].forEach(function (t) {
        var s = document.createElement('source');
        s.src = base + '.' + t[0]; s.type = t[1];
        v.appendChild(s);
      });
      v.addEventListener('loadeddata', function () {
        var ph = slot.querySelector(phSelector);
        if (ph) ph.remove();
        slot.appendChild(v);
        v.play().catch(function () {});
      }, { once: true });
      v.load();
    }

    (function () {
      document.querySelectorAll('.pp-media[data-src]').forEach(function (slot) {
        ppHydrate(slot, slot.getAttribute('data-src'), slot.getAttribute('data-poster') || '', '.pp-media__ph');
      });
    })();
  </script>
</body>
</html>
